<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stick Hero – Stretch, Drop, Survive!</title>
  <meta name="description" content="Hold to stretch the stick, release to drop it and walk across platforms. How far can you go?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>
  <div class="container">
    <div id="score">0</div>

    <div id="perfect">⭐ DOUBLE SCORE!</div>
    <button id="restart">RESTART</button>
  </div>

  <script src="script.js"></script>

</html>
